name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  helm-and-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - run: helm lint deploy/workloads
      - run: helm template workloads deploy/workloads > /tmp/render.yaml
      - run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas /tmp/render.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yamllint
      - name: yamllint
        run: |
          yamllint -d "{extends: default, ignore: [deploy/workloads/templates/], rules: {line-length: {max: 140, level: warning}, document-start: disable, braces: {max-spaces-inside: 1}, truthy: {allowed-values: ['true','false','on']}}}" .
