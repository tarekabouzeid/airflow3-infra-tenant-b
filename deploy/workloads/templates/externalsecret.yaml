apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.tenant }}-workload-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.tenant }}-vault
    kind: SecretStore
  target:
    name: {{ .Values.tenant }}-workload-secrets
    creationPolicy: Owner
  data:
    - secretKey: greeting
      remoteRef:
        key: workload-secrets
        property: greeting
